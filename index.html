<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AWGAMES</title>

  <!-- iPad / iPhone Home Screen Bookmark Icon & App Mode -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AWGAMES">

  <!-- Browser Tab Favicon (Supports SVG) -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Ruffle Flash Emulator -->
  <script src="https://unpkg.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #222;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 3px solid #222;
      padding-bottom: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 2px;
    }
    header span {
      font-size: 1rem;
      color: #666;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 700px;
    }
    .card {
      background: #fff;
      border: 3px solid #222;
      border-radius: 22px;
      height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
      text-align: center;
    }
    .card:hover, .card:active {
      transform: scale(1.03);
      background-color: #eef6ff;
    }
    .card .icon {
      font-size: 2.6rem;
      margin-top: 10px;
    }
    .card .label {
      font-weight: bold;
      font-size: 1rem;
      border-top: 2px solid #eee;
      width: 100%;
      padding-top: 6px;
    }
    .card .tag {
      font-size: 0.75rem;
      color: #666;
    }
    #player-box {
      display: none;
      width: 100%;
      max-width: 800px;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #222;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
    }
    button:hover, button:active {
      background: #222;
      color: #fff;
    }
    #ruffle-container {
      width: 100%;
      height: 460px;
      background: #000;
      border: 3px solid #222;
      border-radius: 16px;
      overflow: hidden;
    }
    #ruffle-container.ipad-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9998;
      border: none;
      border-radius: 0;
    }
    #exit-fs-btn {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 2px solid #fff;
    }
    /* On-Screen iPad Touch Controls */
    .touch-pad {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      gap: 10px;
    }
    .touch-pad.fs-overlay {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      width: auto;
      z-index: 9999;
      pointer-events: none;
    }
    .dpad, .action-btns {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }
    .t-btn {
      width: 62px;
      height: 62px;
      font-size: 1.4rem;
      font-weight: bold;
      border: 3px solid #222;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .t-btn.wide {
      width: 100px;
      font-size: 1rem;
    }
    .t-btn:active, .t-btn.pressed {
      background: #222;
      color: #fff;
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <header>
    <h1>AWGAMES</h1>
    <span>(for School)</span>
  </header>

  <button id="exit-fs-btn" onclick="exitFullscreen()">✕ Exit Fullscreen</button>

  <!-- Main 4-Box Grid -->
  <div class="grid" id="menu-grid">
    <div class="card" onclick="openSwf('duck-life.swf', 'Duck Life')">
      <div class="icon">🦆</div>
      <div>
        <div class="label">Duck Life</div>
        <div class="tag">Game</div>
      </div>
    </div>

    <div class="card" onclick="openSwf('Run.swf', 'Run')">
      <div class="icon">🏃</div>
      <div>
        <div class="label">Run</div>
        <div class="tag">Game</div>
      </div>
    </div>

    <div class="card" onclick="openSwf('candybar.swf', 'Firey\'s Candy Bar Adventure')">
      <div class="icon">🔥</div>
      <div>
        <div class="label">Firey's Candy Bar</div>
        <div class="tag">Game</div>
      </div>
    </div>

    <div class="card" onclick="openSwf('main1.swf', 'Homestar Runner')">
      <div class="icon">⭐</div>
      <div>
        <div class="label">Homestar Runner</div>
        <div class="tag">Movie / Menu</div>
      </div>
    </div>
  </div>

  <!-- Built-in Ruffle Player + Touch Controls -->
  <div id="player-box">
    <div class="controls">
      <button onclick="closeSwf()">⬅ Back</button>
      <strong id="now-playing">Title</strong>
      <button onclick="goFullscreen()">⛶ Fullscreen</button>
    </div>

    <div id="ruffle-container"></div>

    <!-- iPad Touch Controller -->
    <div class="touch-pad" id="touch-pad">
      <div class="dpad">
        <div class="t-btn" data-key="ArrowLeft" data-code="ArrowLeft" data-keyCode="37">◀</div>
        <div class="t-btn" data-key="ArrowDown" data-code="ArrowDown" data-keyCode="40">▼</div>
        <div class="t-btn" data-key="ArrowRight" data-code="ArrowRight" data-keyCode="39">▶</div>
      </div>
      <div class="action-btns">
        <div class="t-btn" data-key="ArrowUp" data-code="ArrowUp" data-keyCode="38">▲</div>
        <div class="t-btn wide" data-key=" " data-code="Space" data-keyCode="32">JUMP</div>
      </div>
    </div>
  </div>

  <script>
    let currentPlayer = null;

    function openSwf(fileName, title) {
      document.getElementById('menu-grid').style.display = 'none';
      document.getElementById('player-box').style.display = 'flex';
      document.getElementById('now-playing').textContent = title;

      const container = document.getElementById('ruffle-container');
      container.innerHTML = '';

      const ruffle = window.RufflePlayer.newest();
      currentPlayer = ruffle.createPlayer();
      currentPlayer.style.width = '100%';
      currentPlayer.style.height = '100%';
      container.appendChild(currentPlayer);
      currentPlayer.load(fileName);
    }

    function closeSwf() {
      exitFullscreen();
      document.getElementById('ruffle-container').innerHTML = '';
      document.getElementById('player-box').style.display = 'none';
      document.getElementById('menu-grid').style.display = 'grid';
    }

    function goFullscreen() {
      const container = document.getElementById('ruffle-container');
      if (container.requestFullscreen) {
        container.requestFullscreen().catch(() => enableIpadFullscreen());
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else {
        enableIpadFullscreen();
      }
    }

    function enableIpadFullscreen() {
      document.getElementById('ruffle-container').classList.add('ipad-fullscreen');
      document.getElementById('touch-pad').classList.add('fs-overlay');
      document.getElementById('exit-fs-btn').style.display = 'block';
    }

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.webkitFullscreenElement) {
        document.webkitExitFullscreen();
      }
      document.getElementById('ruffle-container').classList.remove('ipad-fullscreen');
      document.getElementById('touch-pad').classList.remove('fs-overlay');
      document.getElementById('exit-fs-btn').style.display = 'none';
    }

    // Send virtual keyboard presses to Ruffle
    function sendKey(type, btn) {
      if (!currentPlayer) return;
      currentPlayer.focus();

      const key = btn.getAttribute('data-key');
      const code = btn.getAttribute('data-code');
      const keyCode = parseInt(btn.getAttribute('data-keyCode'), 10);

      const event = new KeyboardEvent(type, {
        key: key,
        code: code,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true,
        cancelable: true
      });

      currentPlayer.dispatchEvent(event);
      document.dispatchEvent(event);
    }

    document.querySelectorAll('.t-btn').forEach(btn => {
      const press = (e) => {
        e.preventDefault();
        btn.classList.add('pressed');
        sendKey('keydown', btn);
      };
      const release = (e) => {
        e.preventDefault();
        btn.classList.remove('pressed');
        sendKey('keyup', btn);
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    });
  </script>

</body>
</html>
