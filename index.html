<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AWGAMES</title>

  <!-- iPad / iPhone Home Screen Bookmark Icon & App Mode -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AWGAMES">

  <!-- Browser Tab Favicon (Supports SVG) -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Ruffle Flash Emulator -->
  <script src="https://unpkg.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #222;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }
    header {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 3px solid #222;
      padding-bottom: 10px;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 2px;
    }
    header span {
      font-size: 1rem;
      color: #666;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 700px;
    }
    .card {
      background: #fff;
      border: 3px solid #222;
      border-radius: 22px;
      height: 150px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.15s;
      text-align: center;
    }
    .card:hover, .card:active {
      transform: scale(1.03);
      background-color: #eef6ff;
    }
    .card .icon {
      font-size: 2.6rem;
      margin-top: 10px;
    }
    .card .label {
      font-weight: bold;
      font-size: 1rem;
      border-top: 2px solid #eee;
      width: 100%;
      padding-top: 6px;
    }
    .card .tag {
      font-size: 0.75rem;
      color: #666;
    }
    #player-box {
      display: none;
      width: 100%;
      max-width: 800px;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      font-weight: bold;
      border: 2px solid #222;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
    }
    button:hover, button:active {
      background: #222;
      color: #fff;
    }
    #ruffle-container {
      width: 100%;
      height: 520px;
      background: #000;
      border: 3px solid #222;
      border-radius: 16px;
      overflow: hidden;
    }
    #ruffle-container.ipad-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      border: none;
      border-radius: 0;
    }
    #exit-fs-btn {
      display: none;
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>

  <header>
    <h1>AWGAMES</h1>
    <span>(for School)</span>
  </header>

  <button id="exit-fs-btn" onclick="exitFullscreen()">✕ Exit Fullscreen</button>

  <!-- Main 4-Box Grid -->
  <div class="grid" id="menu-grid">
    <div class="card" onclick="openSwf('duck-life.swf', 'Duck Life')">
      <div class="icon">🦆</div>
      <div>
        <div class="label">Duck Life</div>
        <div class="tag">Game</div>
      </div>
    </div>

    <div class="card" onclick="openSwf('Run.swf', 'Run')">
      <div class="icon">🏃</div>
      <div>
        <div class="label">Run</div>
        <div class="tag">Game</div>
      </div>
    </div>

    <div class="card" onclick="openSwf('candybar.swf', 'Firey\'s Candy Bar Adventure')">
      <div class="icon">🔥</div>
      <div>
        <div class="label">Firey's Candy Bar</div>
        <div class="tag">Game</div>
      </div>
    </div>

    <div class="card" onclick="openSwf('main1.swf', 'Homestar Runner')">
      <div class="icon">⭐</div>
      <div>
        <div class="label">Homestar Runner</div>
        <div class="tag">Movie / Menu</div>
      </div>
    </div>
  </div>

  <!-- Built-in Ruffle Player -->
  <div id="player-box">
    <div class="controls">
      <button onclick="closeSwf()">⬅ Back</button>
      <strong id="now-playing">Title</strong>
      <button onclick="goFullscreen()">⛶ Fullscreen</button>
    </div>
    <div id="ruffle-container"></div>
  </div>

  <script>
    let currentPlayer = null;

    function openSwf(fileName, title) {
      document.getElementById('menu-grid').style.display = 'none';
      document.getElementById('player-box').style.display = 'flex';
      document.getElementById('now-playing').textContent = title;

      const container = document.getElementById('ruffle-container');
      container.innerHTML = '';

      const ruffle = window.RufflePlayer.newest();
      currentPlayer = ruffle.createPlayer();
      currentPlayer.style.width = '100%';
      currentPlayer.style.height = '100%';
      container.appendChild(currentPlayer);
      currentPlayer.load(fileName);
    }

    function closeSwf() {
      exitFullscreen();
      document.getElementById('ruffle-container').innerHTML = '';
      document.getElementById('player-box').style.display = 'none';
      document.getElementById('menu-grid').style.display = 'grid';
    }

    function goFullscreen() {
      const container = document.getElementById('ruffle-container');
      if (container.requestFullscreen) {
        container.requestFullscreen().catch(() => enableIpadFullscreen());
      } else if (container.webkitRequestFullscreen) {
        container.webkitRequestFullscreen();
      } else {
        enableIpadFullscreen();
      }
    }

    function enableIpadFullscreen() {
      document.getElementById('ruffle-container').classList.add('ipad-fullscreen');
      document.getElementById('exit-fs-btn').style.display = 'block';
    }

    function exitFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.webkitFullscreenElement) {
        document.webkitExitFullscreen();
      }
      document.getElementById('ruffle-container').classList.remove('ipad-fullscreen');
      document.getElementById('exit-fs-btn').style.display = 'none';
    }
  </script>

</body>
</html>
